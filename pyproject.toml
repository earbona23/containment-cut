[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "containment-cut"
version = "0.1.0"
description = "Minimum-cost containment cut: the cheapest set of actions that severs a compromised identity from the crown jewels."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Eduard Arbona" }]
keywords = ["security", "incident-response", "containment", "entra-id", "azure", "min-cut", "max-flow", "blue-team"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
# Zero runtime dependencies. A tool that runs during an incident should not drag a
# dependency tree into the blast radius, and Ed25519 verification is 90 lines of
# arithmetic (see license/ed25519.py) rather than a reason to depend on OpenSSL.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "networkx>=3.0",       # test-only: differential oracle for the max-flow solver
  "cryptography>=42.0",  # test-only + owner-only minting: oracle for Ed25519
]

[project.scripts]
containment-cut = "containment_cut.cli:main"

[project.urls]
Homepage = "https://github.com/earbona23/containment-cut"
Source = "https://github.com/earbona23/containment-cut"
Issues = "https://github.com/earbona23/containment-cut/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/containment_cut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "differential: cross-checks our solver against an independent implementation",
  "slow: takes more than a second",
]
